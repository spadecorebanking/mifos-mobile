name: Build, publish and deploy Mifos Mobile Web

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mifos-mobile-web-${{ github.ref }}
  cancel-in-progress: false

env:
  MIFOS_WEB_IMAGE: spadecorebanking/spadeplatform
  MIFOS_WEB_DOMAIN: mobile.spadecorebanking.com

jobs:
  build-and-publish:
    name: Build web image and publish to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "tag=mifos-mobile.develop.${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate Compose configuration
        env:
          MIFOS_WEB_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
          tags: ${{ env.MIFOS_WEB_IMAGE }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mifos-mobile-web
          cache-to: type=gha,mode=max,scope=mifos-mobile-web

  deploy:
    name: Deploy web image to Hostinger
    needs: build-and-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/hostinger-deploy.yml
    with:
      image_tag: ${{ needs.build-and-publish.outputs.image_tag }}
    secrets:
      HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
      HOSTINGER_VM_ID: ${{ secrets.HOSTINGER_VM_ID }}